name: Build Android APK

# Builds an installable Android APK for PegLeg on a GitHub runner.
# The actual build steps live in ci/build-android-apk.sh so that they can be
# reviewed, changed and even run locally without touching this file.

on:
  workflow_dispatch:
    inputs:
      godot_tag:
        description: 'Godot release tag (editor + .NET export templates)'
        required: false
        default: '4.7.2-stable'
      preset:
        description: 'Godot export preset'
        required: false
        default: 'Android (Test)'
  push:
    branches:
      - 'arena/**'
      - dev
    paths-ignore:
      - '**.md'
      - 'Builds/**'

permissions:
  contents: write
  actions: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    name: Export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GODOT_TAG: ${{ github.event.inputs.godot_tag || '4.7.2-stable' }}
          GODOT_PRESET: ${{ github.event.inputs.preset || 'Android (Test)' }}
        run: bash ci/build-android-apk.sh

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PegLeg-Android-APK-${{ github.run_number }}
          path: |
            Builds/Android/Beta/PegLegBeta-Android.apk
            build-report.md
            export-*.log
            compile-check.log
          if-no-files-found: warn
          retention-days: 30
